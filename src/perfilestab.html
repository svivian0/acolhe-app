<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Estabelecimentos</title>
    <link rel="stylesheet" href="/style/perfilestab.css">
    <link rel="stylesheet" href="/style/header.css">
</head>
<body>

        <!-- Seção do Cabeçalho: Contém o logo, menu de navegação e outros controles. -->
    <header class="main-header">
        <!-- Container para a parte esquerda do cabeçalho (logo e navegação) -->
        <div class="header-left">
            <!-- Container para o logotipo -->
            <div class="logo-container">
                <img src="./Imagens/Acolhe_icon.png" alt="Logo Acolhe App" class="logo">
            </div>

            <!-- Seção de Navegação Principal. -->
            <nav class="main-nav">
                <!-- Lista não ordenada que contém os links do menu -->
                <ul>
                    <li><a href="#">INÍCIO</a></li>
                    <li><a href="#">COMÉRCIO</a></li>
                    <li><a href="#">SOBRE NÓS</a></li>
                </ul>
            </nav>
        </div>

        <!-- Container para a parte central do cabeçalho (pesquisa e ícones de usuário) -->
        <div class="header-center">
            <!-- Barra de pesquisa -->
            <div class="search-bar">
                <!-- Ícone de lupa clicável (envolvido por um botão) -->
                <button class="search-button">
                    <img src="./Imagens/Lupa.png" alt="Ícone de pesquisa" class="search-icon-img">
                </button>
                <!-- Campo de entrada para o usuário digitar o termo de pesquisa -->
                <input type="search" placeholder="Pesquisar">
            </div>

            <!-- Container para os ícones de usuário -->
            <div class="header-right">
                <!-- Menu de usuário com ícones de perfil e opções -->
                <div class="user-menu">
                    <!-- Ícone de perfil de usuário substituído por uma imagem -->
                    <img src="./Imagens/IconUser.png" alt="Ícone do Perfil" class="icon user-icon">
                    <!-- Ícone de menu "sanduíche" substituído por uma imagem -->
                    <img src="./Imagens/Barrinhasp.png" alt="Menu de opções" class="icon menu-icon">
                </div>
            </div>
        </div>
    </header>


    <div class="user">
    <img id="imgestabc" 
    src="/Imagens/imgcarregando.png" 
    alt="">

    <h2 id="NomeLocal">NOME ESTABELECIMENTO</h2>

    </div>
</body>
</html>
