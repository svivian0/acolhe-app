<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Acolhe App</title>
    <!-- Importa a fonte do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link para a nova folha de estilos do login -->
    <link rel="stylesheet" href="/style/login_styles.css">
</head>
<body>
    <!-- Container principal que cobre toda a página -->
    <div class="login-page">
        <!-- Caixa de login centralizada -->
        <div class="login-container">
            <!-- Seção da esquerda com a logo e o slogan -->
            <div class="login-info">
                <img src="/Imagens/Acolhe_icon.png" alt="Logo Acolhe App" class="info-logo">
                <h1>Acolhe App</h1>
                <p>Onde a inclusão acontece de verdade!</p>
            </div>

            <!-- Seção da direita com o formulário -->
            <div class="login-form">
                <h2>Login</h2>
                <form>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="login-btn">Entrar</button>
                </form>
                <div class="signup-link">
                    <span>Não tem uma conta ainda?</span>
                    <a href="#">Cadastre-se</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
